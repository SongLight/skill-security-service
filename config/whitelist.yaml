# Code Scanner Whitelist Configuration
# 白名单配置 - 用于排除误报或已知安全的模式

# 文件白名单 - 排除特定文件或路径
files:
  - "**/README.md"
  - "**/README_*.md"
  - "**/CHANGELOG.md"
  - "**/CONTRIBUTING.md"
  - "**/docs/**/*.md"
  - "**/examples/**/*"

# 规则ID白名单 - 禁用特定规则
rules:
  # 示例：禁用特定规则
  # - SOC001  # 禁用加密钱包关键词检测
  # - NET003  # 禁用 Python requests 检测

# 域名白名单 - 信任的域名
domains:
  # 官方API域名
  - "api.anthropic.com"
  - "api.openai.com"
  - "api.github.com"
  - "pypi.org"
  - "npmjs.org"
  
  # 开发者常用域名
  - "localhost"
  - "127.0.0.1"
  - "example.com"
  - "test.local"

# 严重级别覆盖 - 自定义特定规则的严重级别
severity_overrides:
  # 示例：将某个规则的严重级别从 HIGH 降低到 MEDIUM
  # PER003: MEDIUM  # macOS launchd 持久化降低级别
